name: Daily Brief

on:
  schedule:
    # Cron is UTC and Dublin is UTC+0 or UTC+1, so 07:00 (workdays) and
    # 08:00 (weekends and bank holidays) in Dublin fall at 06:00, 07:00 or
    # 08:00 UTC. main.py works out the day and time in Dublin and only one
    # of these sends the brief each day.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send the brief
        # A manual run sends straight away, whatever the time.
        run: python main.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
