name: Daily Brief

on:
  schedule:
    # Cron is UTC and Dublin is UTC+0 or UTC+1, so 06:30 (workdays) and
    # 08:00 (weekends and bank holidays) in Dublin fall at 05:30 or 06:30 and
    # 07:00 or 08:00 UTC. Each of those has an entry 7 minutes after it and a
    # retry 30 minutes later, since GitHub delays or drops many runs. They
    # avoid :00, when GitHub is busiest. main.py works out the day and time in
    # Dublin, and the "sent today" marker below stops a second send.
    - cron: "37 5 * * *"
    - cron: "7 6 * * *"
    - cron: "37 6 * * *"
    - cron: "7 7 * * *"
    - cron: "37 7 * * *"
    - cron: "7 8 * * *"
    - cron: "37 8 * * *"
  # GitHub starts scheduled runs late or not at all (on 2026-10-15 it started
  # none), so an outside scheduler also dispatches this workflow at the cron
  # times with `scheduled: true`. Such a run behaves exactly like a scheduled
  # one. A manual run leaves it off and sends straight away.
  workflow_dispatch:
    inputs:
      scheduled:
        description: Behave like a scheduled run (send window and "sent today" marker)
        type: boolean
        default: false

# Runs queue rather than overlap, so a run always sees the marker left by the
# one before it.
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # only to re-enable this workflow, see the last step

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # "true" for a cron run or an outside scheduler's dispatch, "false" for a manual run.
      SCHEDULED: ${{ github.event_name == 'schedule' || inputs.scheduled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find today's date in Dublin
        id: today
        run: echo "date=$(TZ=Europe/Dublin date +%F)" >> "$GITHUB_OUTPUT"
      - name: Check whether today's brief has gone out
        # The run that sends leaves a cache entry, so later runs that day skip.
        if: env.SCHEDULED == 'true'
        id: sent
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: brief-sent-${{ steps.today.outputs.date }}
          lookup-only: true
      - name: Send the brief
        if: steps.sent.outputs.cache-hit != 'true'
        # A manual run sends straight away, whatever the time, and leaves no marker.
        run: python main.py ${{ env.SCHEDULED == 'true' && '--sent-file .sent' || '--force' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      - name: Remember that today's brief has gone out
        if: env.SCHEDULED == 'true' && hashFiles('.sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: brief-sent-${{ steps.today.outputs.date }}
      - name: Keep the schedule alive
        # GitHub pauses schedules in public repos after 60 days without activity.
        # Re-enabling the workflow through the API restarts that clock.
        if: always() && env.SCHEDULED == 'true'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-brief.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
