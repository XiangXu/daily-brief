# English copy of config.yaml. Tests read this so they don't depend on the
# wording in the real config. tests/test_config.py keeps the two in sync.
schedule:
  timezone: Europe/Dublin
  # Local times. Days off are weekends and public holidays in `holidays`
  # (a country code for the `holidays` package).
  send_times:
    weekday: "07:00"
    day_off: "08:00"
  holidays: IE
  # The run goes ahead if it starts within this many minutes after the send time.
  # Must stay below 60, the gap between the workflow's cron entries, so only one sends.
  window_minutes: 55

location:
  name: Dublin
  latitude: 53.35
  longitude: -6.26

weather:
  # The hours summarised in the brief are clothing.windows.day.
  timeout_seconds: 10

brief:
  # Everything the brief writes itself. Placeholders in {braces} are filled in.
  title: "Daily Brief: {weekday} {day} {month}"
  weekdays: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
  months: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  headings:
    weather: Weather
    clothing: What to wear
    news: News
  unavailable: unavailable
  weather_line: "{city}: {temp}, feels like {feels}, rain {rain_mm} mm ({rain}%), wind {wind} km/h, UV {uv}"
  temp_range: "{low} to {high}°C"
  temp_single: "{low}°C"
  person_line: "{name}: {items}"
  lang: en
  footer: "Generated at {time} · {city}"
  weather_labels:
    temp: Temperature
    feels: Feels like
    rain: Rain
    wind: Wind
    gust: gusts
    uv: UV
  alerts:
    rain_light: "Light rain: an umbrella or a hood"
    rain_steady: "Steady rain: wear waterproofs"
    wind: "Very gusty: skip the umbrella"
    uv: "UV 3 or more: use sunscreen"
  # The big emoji in the header: that of the first alert, or `default` on a quiet day.
  icons:
    rain_steady: "🌧️"
    rain_light: "🌦️"
    wind: "💨"
    uv: "☀️"
    default: "🌤️"
  all_clear: "Nothing special to watch today"
  window_label: "out {start}–{end}"

people:
  # `windows` are the hours each person is outside (names from clothing.windows).
  # They dress for the first one; the others are checked for rain and for a
  # change in temperature later in the day.
  - name: Me
    emoji: "👨"
    offset: 0
    windows: [morning, lunch, evening]
  - name: Wife
    emoji: "👩"
    offset: -3  # feels the cold: dressed as if it were 3°C colder
    windows: [morning, lunch, evening]
  - name: Child
    emoji: "🧒"
    offset: 0
    child: true
    windows: [school_run, pickup]

clothing:
  # Local hours, end excluded. `day` is used for the weather warnings.
  windows:
    morning: [7, 10]
    lunch: [12, 14]
    evening: [16, 19]
    school_run: [8, 9]
    pickup: [13, 15]
    day: [7, 19]
  # Sustained wind (km/h) makes it feel colder: take this many degrees off.
  wind_chill:
    - {min: 15, minus: 1}
    - {min: 30, minus: 2}
    - {min: 45, minus: 3}
  # Checked top to bottom against air temperature (°C), less the wind step,
  # plus the person's offset. The last tier has no minimum and catches the rest.
  tiers:
    - {min: 19, top: "short sleeves"}
    - {min: 15, top: "light long sleeves", outer: "light jacket"}
    - {min: 11, top: "long sleeves + light sweater", outer: "jacket"}
    - {min: 7, top: "sweater", outer: "heavy jacket"}
    - {min: 3, top: "sweater + thermal layer", outer: "warm coat", extras: "hat + gloves"}
    - {top: "sweater + thermal layer", outer: "down coat", extras: "hat + gloves + scarf"}
  # A note when a later window is this much warmer or colder and in another tier.
  change_later:
    min_degrees: 3
    warmer: "Warms up later: you can take a layer off"
    colder: "Cooler later: bring an extra layer"
  rain:
    # Light: this much in total, or one hour that is both likely and wet.
    light: {total_mm: 0.3, probability: 60, hour_mm: 0.1}
    # Steady: one properly wet hour, or this much in total.
    steady: {total_mm: 3.0, hour_mm: 1.0}
    umbrella_max_gust: 40  # km/h: above this an umbrella is useless, so a hood instead
    umbrella: "folding umbrella"
    hooded_outer: "hooded {outer}"
    waterproof_outer: "waterproof {outer}"
    no_outer:  # when the temperature tier has no outer layer
      light: "light rain jacket"
      steady: "waterproof jacket"
  wind:
    gust_threshold: 65  # km/h
    advice: "Very windy: skip the umbrella"
  uv:
    - {min: 6, advice: "sunscreen + hat + sunglasses", child_advice: "sunscreen + sun hat"}
    - {min: 3, advice: "sunscreen", child_advice: "sunscreen + sun hat"}
  child:
    boots: "rain boots"  # steady rain only
    spare:
      light: "spare socks in the bag"
      steady: "spare socks and top in the bag"
    dark: "bright or reflective jacket"  # school run before sunrise or pickup after sunset

news:
  # Words that move a story up within its section (whole words for English,
  # plain match for Chinese; case-insensitive). A title match counts double a
  # description match, and each distinct word counts once. A section can add
  # its own `keywords`, and `min_score: 1` keeps only stories that match.
  keywords:
    - Java
    - JDK
    - Spring
    - Angular
    - Kubernetes
    - K8s
    - Docker
    - AWS
    - Oracle
    - Lambda
    - EKS
    - S3
    - AI
    - LLM
    - Claude
    - OpenAI
    - Gemini
    - agent
    - security
    - CVE
    - vulnerability
    - outage
    - release
    - 人工智能
    - 大模型
    - 智能体
    - 云原生
    - 开源
    - 数据库
    - 漏洞
    - 安全
    - 云计算
    - 芯片
  # Each section has its own feeds and number of slots, so no topic crowds out another.
  groups:
    - name: Entertainment
      limit: 5
      use_global_keywords: false
      max_per_source: 5  # a single site: let it fill the section
      feeds:
        - url: https://ent.sina.cn/
          parser: sina_ent
          name: Sina Entertainment
    - name: Chinese news
      limit: 3
      use_global_keywords: false
      max_per_source: 1  # one headline per outlet
      feeds:
        - https://feeds.bbci.co.uk/zhongwen/simp/rss.xml
        - https://cn.nytimes.com/rss/
        - https://rss.dw.com/xml/rss-chi-all
        - https://www.ftchinese.com/rss/news
    - name: Chinese tech
      limit: 4
      feeds:
        - https://www.infoq.cn/feed
        - https://www.qbitai.com/feed
        - https://www.oschina.net/news/rss
        - https://www.solidot.org/index.rss
        - https://www.ithome.com/rss/
    - name: Chinese cars
      limit: 3
      use_global_keywords: false
      max_per_source: 2
      keywords: [汽车, 新能源, 电动车, 纯电, 增程, 新车, 车型, 试驾, 续航, 智驾, 自动驾驶, 特斯拉, 比亚迪, 小米汽车, 小米SU7, 小米YU7, 蔚来, 小鹏, 问界, 极氪, 零跑, 理想汽车]
      feeds:
        - url: https://www.dongchedi.com/
          parser: dongchedi
          name: 懂车帝
        - url: https://www.autohome.com.cn/news/
          parser: autohome
          name: 汽车之家
    - name: Ireland
      limit: 3
      use_global_keywords: false
      feeds:
        - https://www.rte.ie/feeds/rss/?index=/news/
        - https://www.rte.ie/feeds/rss/?index=/news/business/
        - https://www.thejournal.ie/feed/
    - name: IT and AI
      limit: 4
      feeds:
        - https://feed.infoq.com/
        - https://hnrss.org/frontpage
        - https://www.theregister.com/headlines.atom
        - https://techcrunch.com/category/artificial-intelligence/feed/
        - https://arstechnica.com/ai/feed/
        - https://openai.com/news/rss.xml
        - https://blog.google/technology/ai/rss/
    - name: Tech stack
      limit: 3
      feeds:
        - https://inside.java/feed.xml
        - https://spring.io/blog.atom
        - https://blog.angular.dev/feed
        - https://kubernetes.io/feed.xml
        - https://www.docker.com/blog/feed/
        - https://aws.amazon.com/blogs/aws/feed/
        - https://aws.amazon.com/about-aws/whats-new/recent/feed/
    - name: Cars
      limit: 5
      use_global_keywords: false
      max_per_source: 1  # one headline per site, in the order listed below
      feeds:
        - url: https://www.completecar.ie/
          parser: completecar
          name: Complete Car
        - url: https://www.carwow.co.uk/news
          parser: carwow
          name: Carwow
        - https://www.autocar.co.uk/rss
        - https://www.caranddriver.com/rss/all.xml/
        - https://www.motor1.com/rss/articles/all/
        - https://electrek.co/feed/
  max_items_per_feed: 10
  # Sent with every feed request: some sites reject unknown clients.
  user_agent: Mozilla/5.0 (compatible; daily-brief/1.0)
  # Dated items older than this are dropped, so slow blogs don't repeat daily.
  max_age_hours: 30
  # Item descriptions are cut to this length, since only keyword matching uses them.
  summary_max_chars: 300
  # The most any one feed may contribute to a section.
  max_per_source: 3
  timeout_seconds: 10  # per feed
  # Sites fetched at the same time. The tests use 1 so mocked replies arrive in order.
  max_workers: 1

notify:
  # Every channel listed here gets the brief. Available: email, wecom.
  channels:
    - email
  retries: 2
  retry_delay_seconds: 5
  timeout_seconds: 10
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 465
    recipients:
      # Testing: only me for now. Add the wife's address when ready.
      - me@example.com
